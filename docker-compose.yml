
services:

  mysql:

    image: mysql:8.4

    restart: unless-stopped

    environment:

      MYSQL_DATABASE: ${MYSQL_DATABASE:-milesora_db}

      MYSQL_USER: ${MYSQL_USER:-milesora_app}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    ports:

      - "3307:3306"

    volumes:

      - milesora_mysql_data:/var/lib/mysql

    healthcheck:

      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p/"$$MYSQL_ROOT_PASSWORD/""]

      interval: 10s

      timeout: 5s

      retries: 10



volumes:

  milesora_mysql_data:

