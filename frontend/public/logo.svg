<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pulseGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer Hexagon Nodes Network -->
  <polygon points="50,12 85,32 85,72 50,92 15,72 15,32" stroke="url(#pulseGrad)" stroke-width="4.5" stroke-linejoin="round" fill="none" opacity="0.4" />
  
  <!-- Interconnected Data Arcs & Task Progress Nodes -->
  <path d="M 28 35 L 50 24 L 72 35 L 72 65 L 50 76 L 28 65 Z" stroke="url(#pulseGrad)" stroke-width="3" stroke-dasharray="4 2" fill="none" opacity="0.6" />
  
  <!-- Pulse Wave Signal (Activity & Progress) -->
  <path d="M 22 52 L 36 52 L 44 32 L 53 70 L 62 44 L 68 52 L 78 52" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Nodes (Team & Tasks) -->
  <circle cx="50" cy="12" r="5" fill="#2563EB" />
  <circle cx="85" cy="32" r="5" fill="#0891B2" />
  <circle cx="85" cy="72" r="5" fill="#06B6D4" />
  <circle cx="50" cy="92" r="5" fill="#2563EB" />
  <circle cx="15" cy="72" r="5" fill="#0891B2" />
  <circle cx="15" cy="32" r="5" fill="#06B6D4" />
  
  <!-- Central Pulse Nucleus -->
  <circle cx="50" cy="52" r="3.5" fill="#06B6D4" />
</svg>
