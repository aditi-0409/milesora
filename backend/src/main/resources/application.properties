spring.application.name=milesora

spring.datasource.url=jdbc:mysql://localhost:3306/milesora_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${MILESORA_JWT_SECRET}
app.jwt.expiration-ms=3600000

server.port=8080 

# Attachment Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Store uploaded files outside the public web directory
app.file.upload-dir=${MILESORA_UPLOAD_DIR:./milesora-uploads}